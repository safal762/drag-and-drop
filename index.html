<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Simple Kanban Board</title>
</head>
<body>
    <h1 id="head">Simple Kanban Board</h1>
    <div class="container">
        <div class="todo box">
            <h1>To DO</h1>
            <button id="card-1" class="card" draggable="true">bye</button>
        </div>
        <div class="inProgress box">
            <h1>In Progress</h1>
            <button id="card-2" class="card" draggable="true">wash clothes</button>
        </div>
        <div class="done box">
            <h1>Done</h1>
            <button id="card-3" class="card" draggable="true">Done</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
